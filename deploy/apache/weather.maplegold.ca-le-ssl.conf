<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin admin@maplegold.ca
    ServerName weather.maplegold.ca

    ErrorLog ${APACHE_LOG_DIR}/weather.maplegold.ca-error.log
    CustomLog ${APACHE_LOG_DIR}/weather.maplegold.ca-access.log combined

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Forward the live-reading WebSocket before the catch-all HTTP route.
    ProxyPass /ws/ ws://piagara.local/ws/ retry=0 timeout=90
    ProxyPassReverse /ws/ ws://piagara.local/ws/

    ProxyPass / http://piagara.local/ retry=0 timeout=90
    ProxyPassReverse / http://piagara.local/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/weather.maplegold.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/weather.maplegold.ca/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
